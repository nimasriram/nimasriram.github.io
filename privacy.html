<title>Homebase privacy policy</title>
<h1>Privacy policy</h1>
<p>Homebase is a personal app used only by its owner. It reads the owner's own Google Calendar events (read-only) to show their daily schedule. Calendar data is not shared with anyone, sold, or used for advertising. It stays on the owner's own server and devices.</p>
